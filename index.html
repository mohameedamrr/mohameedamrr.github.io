<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohamed Amr</title>
<meta name="description" content="Mohamed Amr — Data Engineer building scalable data pipelines on Google Cloud.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1120;
  --bg-2:#111b2e;
  --nav:rgba(10,17,32,.85);
  --card:#14213a;
  --card-hover:#1a2a48;
  --text:#ccd6f6;
  --muted:#8892b0;
  --dim:#5a6584;
  --accent:#64ffda;
  --accent-soft:rgba(100,255,218,.08);
  --line:#233554;
  --track:#1c2c4a;
  --shadow:rgba(2,8,20,.75);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Kanit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--muted);font-family:var(--sans);font-weight:300;font-size:18px;line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--bg)}

/* nav */
nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 48px;background:var(--nav);backdrop-filter:blur(10px);transition:box-shadow .3s,padding .3s,background .4s}
nav.scrolled{box-shadow:0 10px 30px -10px var(--shadow);padding:12px 48px}
.logo{font-family:var(--mono);color:var(--accent);font-size:20px;font-weight:500;margin-right:auto;white-space:nowrap}
.links{display:flex;align-items:center;gap:32px;list-style:none;font-family:var(--mono);font-size:14px}
.links a{color:var(--text);transition:color .2s}
.links a:hover{color:var(--accent)}
.links a span{color:var(--accent);margin-right:4px}
.btn{display:inline-block;font-family:var(--mono);font-size:14px;color:var(--accent)!important;border:1px solid var(--accent);border-radius:6px;padding:12px 22px;transition:background .2s,transform .2s}
.btn:hover{background:var(--accent-soft);transform:translateY(-2px)}
.btn.sm{padding:8px 16px;font-size:13px}

/* side rails */
.rail{position:fixed;bottom:0;width:40px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:22px}
.rail::after{content:"";width:1px;height:90px;background:var(--muted)}
.rail.left{left:40px}
.rail.right{right:40px}
.rail a{color:var(--muted);transition:color .2s,transform .2s}
.rail a:hover{color:var(--accent);transform:translateY(-3px)}
.rail svg{width:20px;height:20px}
.rail.right a{writing-mode:vertical-rl;font-family:var(--mono);font-size:13px;letter-spacing:.1em}

main{max-width:1000px;margin:0 auto;padding:0 120px}
section{padding:110px 0}

/* hero */
#intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:80px;position:relative}
.hi{font-family:var(--mono);color:var(--accent);font-size:16px;margin-bottom:18px}
h1{color:var(--text);font-size:clamp(44px,8vw,84px);font-weight:600;line-height:1.05}
h1 .name{color:var(--accent)}
.caret{display:inline-block;width:4px;height:.9em;background:var(--accent);margin-left:6px;vertical-align:-4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tagline{color:var(--muted);font-size:clamp(28px,5vw,52px);font-weight:500;line-height:1.15;margin-top:10px}
.lede{max-width:560px;margin:26px 0 44px;font-size:19px}
.lede b{color:var(--accent);font-weight:400}
#pipes{position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none}
#pipes path{stroke:var(--track)}
#pipes circle{fill:var(--accent)}

/* headings */
.sh{display:flex;align-items:center;gap:16px;color:var(--text);font-size:clamp(26px,4vw,34px);font-weight:500;margin-bottom:44px;white-space:nowrap}
.sh::before{content:attr(data-n);font-family:var(--mono);color:var(--accent);font-size:.6em;font-weight:400}
.sh::after{content:"";height:1px;background:var(--line);width:100%;max-width:300px}

/* about */
.about{display:grid;grid-template-columns:3fr 2fr;gap:50px;align-items:start}
.about p{margin-bottom:16px}
.about p b{color:var(--accent);font-weight:400}
.tech{display:grid;grid-template-columns:repeat(2,minmax(140px,200px));gap:6px 10px;list-style:none;font-family:var(--mono);font-size:14px;margin-top:20px}
.tech li::before{content:"▹";color:var(--accent);margin-right:10px}
.edu{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.edu h3{color:var(--text);font-weight:500;font-size:18px;margin-bottom:18px;font-family:var(--mono)}
.edu .item{border-left:2px solid var(--accent);padding-left:16px;margin-bottom:20px}
.edu .item:last-child{margin-bottom:0}
.edu .item strong{display:block;color:var(--text);font-weight:400;font-size:16px;line-height:1.35}
.edu .item span{display:block;font-size:14px}
.edu .item em{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--accent)}

/* experience tabs */
.jobs{display:flex;gap:30px;min-height:330px}
.tabs{display:flex;flex-direction:column;position:relative;border-left:2px solid var(--line);flex-shrink:0}
.tabs button{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:14px;text-align:left;padding:0 22px;height:46px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.tabs button:hover,.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.tabs .bar{position:absolute;left:-2px;top:0;width:2px;height:46px;background:var(--accent);transition:transform .3s cubic-bezier(.6,0,.2,1)}
.panel{display:none}
.panel.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel h3{color:var(--text);font-weight:500;font-size:22px;line-height:1.3}
.panel h3 span{color:var(--accent)}
.panel .when{font-family:var(--mono);font-size:13px;margin:4px 0 20px}
.panel ul{list-style:none}
.panel li{position:relative;padding-left:26px;margin-bottom:12px;font-size:17px}
.panel li::before{content:"▹";color:var(--accent);position:absolute;left:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:20px}

/* featured projects */
.feat{position:relative;display:grid;grid-template-columns:repeat(12,1fr);align-items:center;margin-bottom:90px}
.feat .art{grid-column:1/8;grid-row:1;border-radius:10px;overflow:hidden;background:var(--bg-2);border:1px solid var(--line);aspect-ratio:16/10;position:relative;color:var(--accent)}
.feat .art svg{width:100%;height:100%;display:block}
.art .bg{fill:var(--bg-2)}
.art .pn{fill:var(--card);stroke:var(--line)}
.art .pa{fill:var(--card);stroke:var(--accent)}
.art text{fill:var(--muted);font-family:var(--mono)}
.art text.ac{fill:var(--accent)}
.art text.hw{fill:var(--text);font-family:cursive,serif}
.feat .art::after{content:"";position:absolute;inset:0;background:var(--accent);mix-blend-mode:multiply;opacity:.1;transition:opacity .3s}
.feat:hover .art::after{opacity:0}
.feat .info{grid-column:7/-1;grid-row:1;text-align:right;position:relative;z-index:2}
.feat.flip .art{grid-column:6/-1}
.feat.flip .info{grid-column:1/7;text-align:left}
.overline{font-family:var(--mono);color:var(--accent);font-size:13px}
.feat h3{color:var(--text);font-size:26px;font-weight:500;margin:4px 0 18px;line-height:1.25}
.feat h3 a:hover{color:var(--accent)}
.feat .desc{background:var(--card);padding:22px 24px;border-radius:8px;box-shadow:0 10px 30px -15px var(--shadow);font-size:16px}
.feat .desc b{color:var(--accent);font-weight:400}
.feat .stack{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;font-family:var(--mono);font-size:13px;margin-top:18px;justify-content:flex-end}
.feat.flip .stack{justify-content:flex-start}

/* project grid */
.more{text-align:center;color:var(--text);font-size:24px;font-weight:500;margin:20px 0 6px}
.more-sub{text-align:center;font-family:var(--mono);font-size:13px;color:var(--accent);margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border-radius:8px;padding:28px 26px;display:flex;flex-direction:column;transition:transform .25s,background .25s}
.card:hover{transform:translateY(-6px);background:var(--card-hover)}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;color:var(--accent)}
.card .top>svg{width:36px;height:36px}
.card .top a svg{width:20px;height:20px;color:var(--muted)}
.card .top a:hover svg{color:var(--accent)}
.card h4{color:var(--text);font-size:20px;font-weight:500;line-height:1.3;margin-bottom:10px}
.card:hover h4{color:var(--accent)}
.card p{font-size:15px;flex:1}
.card ul{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;font-family:var(--mono);font-size:12px;margin-top:20px;color:var(--dim)}

/* certification badge + cards */
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--accent);border:1px solid var(--line);background:var(--accent-soft);border-radius:20px;padding:6px 14px;margin:-18px 0 36px}
.pill svg{width:16px;height:16px;flex-shrink:0}
.pro{display:flex;gap:22px;align-items:center;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:24px 26px;margin-bottom:22px;box-shadow:0 10px 30px -18px var(--shadow)}
.pro .seal{flex-shrink:0;width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.pro .seal svg{width:30px;height:30px}
.pro .meta{flex:1}
.pro .overline{display:block;margin-bottom:2px}
.pro strong{display:block;color:var(--text);font-weight:500;font-size:22px;line-height:1.25}
.pro p{font-size:15px;margin-top:6px}
.sub{font-family:var(--mono);font-size:13px;color:var(--dim);margin:34px 0 14px}
@media (max-width:768px){.pro{flex-direction:column;align-items:flex-start}}

/* courses */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cert{border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s}
.cert:hover{border-color:var(--accent)}
.cert .ic{flex-shrink:0;width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500}
.cert strong{display:block;color:var(--text);font-weight:400;font-size:16px;line-height:1.35}
.cert span{font-family:var(--mono);font-size:12px}

/* contact */
#contact{text-align:center;max-width:600px;margin:0 auto;padding-bottom:140px}
#contact .overline{display:block;margin-bottom:14px}
#contact h2{color:var(--text);font-size:clamp(38px,6vw,56px);font-weight:600;line-height:1.1;margin-bottom:20px}
#contact p{margin-bottom:44px}
footer{text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim);padding:24px 16px 30px}
footer .mob{display:none;justify-content:center;gap:26px;margin-bottom:14px}
footer .mob svg{width:20px;height:20px}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

.burger{display:none;background:none;border:0;color:var(--accent);cursor:pointer}
.burger svg{width:30px;height:30px}

@media (max-width:1080px){
  main{padding:0 80px}
  .rail{display:none}
  footer .mob{display:flex}
}
@media (max-width:768px){
  nav,nav.scrolled{padding:14px 16px}
  main{padding:0 16px}
  section{padding:80px 0}
  .burger{display:block}
  .links{position:fixed;top:0;right:0;bottom:0;width:min(75vw,320px);flex-direction:column;justify-content:center;gap:30px;background:var(--bg-2);box-shadow:-10px 0 30px -10px var(--shadow);transform:translateX(100%);transition:transform .3s;font-size:16px}
  .links.open{transform:none}
  .about{grid-template-columns:1fr}
  .jobs{flex-direction:column}
  .tabs{flex-direction:row;border-left:0;border-bottom:2px solid var(--line);overflow-x:auto}
  .tabs button{padding:0 16px;flex:1}
  .tabs .bar{display:none}
  .tabs button.on{border-bottom:2px solid var(--accent);margin-bottom:-2px}
  .feat,.feat.flip{display:block;margin-bottom:50px;border-radius:10px;overflow:hidden;position:relative}
  .feat .art{position:absolute;inset:0;aspect-ratio:auto;border:0;opacity:.18}
  .feat .info,.feat.flip .info{text-align:left;padding:32px 22px;position:relative}
  .feat .desc{background:none;box-shadow:none;padding:0}
  .feat .stack,.feat.flip .stack{justify-content:flex-start}
  .tech{grid-template-columns:repeat(2,1fr)}
  .sh::after{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}
</style>
<!-- All the text on this site lives in content.js -->
<script src="content.js"></script>

      <text x="58" y="107">EC2 #1</text><text x="146" y="107">EC2 #2</text><text x="234" y="107">EC2 #3</text>

};

/* ---------- fill the page from content.js ---------- */
document.title = C.name;
$('logo').textContent = `<${C.initials} />`;
$('resume').href = C.resume;
const socials = `<a href="${C.github}" target="_blank" rel="noopener" aria-label="GitHub">${ICON.github}</a><a href="${C.linkedin}" target="_blank" rel="noopener" aria-label="LinkedIn">${ICON.linkedin}</a><a href="${mail}" aria-label="Email">${ICON.mail}</a>`;
$('rail').innerHTML = socials;
$('mob').innerHTML = socials;
$('railMail').href = mail; $('railMail').textContent = C.email;

$('greeting').textContent = C.hero.greeting;
$('tagline').textContent = C.hero.tagline;
$('lede').innerHTML = C.hero.intro;
const certLink = (C.certifications || [])[0]?.link;
if (C.hero.badge) {
  $('pill').innerHTML = ICON.award + C.hero.badge + (certLink ? ' ↗' : '');
  if (certLink) { $('pill').href = certLink; $('pill').target = '_blank'; $('pill').rel = 'noopener'; }
} else $('pill').remove();
$('heroBtn').href = mail; $('heroBtn').textContent = C.hero.button;

$('aboutText').innerHTML = list(C.about.paragraphs, p => `<p>${p}</p>`) +
  `<p>${C.about.techIntro}</p><ul class="tech">${list(C.about.tech, t => `<li>${t}</li>`)}</ul>`;
$('edu').innerHTML = list(C.education, e => `<div class="item"><strong>${e.degree}</strong><span>${e.school}</span><em>${e.years}</em></div>`);

$('tabs').insertAdjacentHTML('afterbegin', list(C.experience, (j, i) => `<button role="tab" class="${i ? '' : 'on'}" data-t="${i}">${j.tab}</button>`));
$('panels').innerHTML = list(C.experience, (j, i) => `
  <div class="panel ${i ? '' : 'on'}">
    <h3>${j.role} <span>@ ${j.company}</span></h3>
    <p class="when">${j.dates}</p>
    <ul>${list(j.bullets, b => `<li>${b}</li>`)}</ul>
    <div class="chips">${list(j.tags, t => `<span>${t}</span>`)}</div>
  </div>`);

$('featured').innerHTML = list(C.featured, (f, i) => `
  <div class="feat ${i % 2 ? 'flip' : ''} rv">
    <div class="art"><svg viewBox="0 0 320 200" aria-hidden="true">${ART[f.art] || ''}</svg></div>
    <div class="info">
      <p class="overline">${f.overline}</p>
      <h3>${f.link ? `<a href="${f.link}" target="_blank" rel="noopener">${f.title}</a>` : f.title}</h3>
      <div class="desc">${f.description}</div>
      <ul class="stack">${list(f.stack, s => `<li>${s}</li>`)}</ul>
    </div>
  </div>`);

$('ghMore').href = C.github;
$('grid').innerHTML = list(C.projects, p => `
  <article class="card rv">
    <div class="top">${ICON[p.icon] || ICON.doc}<a href="${p.link || C.github}" target="_blank" rel="noopener" aria-label="Open project">${ICON.ext}</a></div>
    <h4>${p.title}</h4>
    <p>${p.description}</p>
    <ul>${list(p.stack, s => `<li>${s}</li>`)}</ul>
  </article>`);

$('pro').innerHTML = list(C.certifications || [], c => `
  <div class="pro">
    <div class="seal">${ICON.award}</div>
    <div class="meta"><span class="overline">${c.issuer}</span><strong>${c.title}</strong><p>${c.description}</p></div>
    ${c.link ? `<a class="btn sm" href="${c.link}" target="_blank" rel="noopener">View credential ↗</a>` : ''}
  </div>`);
$('certs').innerHTML = list(C.courses, c => `<div class="cert"><div class="ic">${c.badge}</div><div><strong>${c.title}</strong><span>${c.provider}</span></div></div>`);

$('cOver').textContent = C.contact.overline;
$('cHead').textContent = C.contact.heading;
$('cText').textContent = C.contact.text;
$('cBtn').href = mail; $('cBtn').textContent = C.contact.button;
$('fName').textContent = C.name;
$('yr').textContent = new Date().getFullYear();

/* ---------- typewriter ---------- */
(function(){
  const el = $('typed'), txt = C.name + '.'; let i = 0;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = txt; return; }
  (function t(){ el.textContent = txt.slice(0, ++i); if (i < txt.length) setTimeout(t, 90 + Math.random() * 60); })();
})();

/* ---------- hero background "data flow" lines ---------- */
(function(){
  const svg = $('pipes'), ns = 'http://www.w3.org/2000/svg';
  const paths = ['M-20 120 H300 C360 120 360 200 420 200 H1020','M-20 300 H200 C260 300 260 240 320 240 H700 C760 240 760 420 820 420 H1020','M-20 480 H520 C580 480 580 360 640 360 H1020'];
  paths.forEach((d, k) => {
    const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke-width', '1.2'); svg.appendChild(p);
    for (let j = 0; j < 3; j++) {
      const c = document.createElementNS(ns, 'circle'); c.setAttribute('r', '2.4'); c.setAttribute('opacity', '.6');
      const m = document.createElementNS(ns, 'animateMotion'); m.setAttribute('dur', (9 + k * 2) + 's'); m.setAttribute('repeatCount', 'indefinite'); m.setAttribute('begin', (-j * (3 + k)) + 's'); m.setAttribute('path', d);
      c.appendChild(m); svg.appendChild(c);
    }
  });
})();

/* ---------- experience tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  const n = +b.dataset.t;
  document.querySelectorAll('.tabs button').forEach((x, i) => x.classList.toggle('on', i === n));
  document.querySelectorAll('.panel').forEach((x, i) => x.classList.toggle('on', i === n));
  $('bar').style.transform = `translateY(${n * 46}px)`;
}));

/* ---------- nav shadow + mobile menu ---------- */
const nav = $('nav'), links = $('links');
addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 20), { passive: true });
$('burger').addEventListener('click', e => { e.stopPropagation(); links.classList.toggle('open'); });
links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
document.addEventListener('click', e => { if (!links.contains(e.target)) links.classList.remove('open'); });

/* ---------- reveal on scroll ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll('.rv').forEach(el => io.observe(el));
</script>
</body>
</html>
